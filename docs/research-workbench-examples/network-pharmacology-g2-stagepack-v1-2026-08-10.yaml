protocol_logic:
  evidence_channels:
    M:
      purpose: method_normative_database_algorithm_and_reproducibility_evidence_census
      denominator: screened_M_method_evidence_families
    A:
      purpose: probability_sampled_application_practice_audit
      mother_universe_pilot_records: 17528
      strata:
        y2018_2020: 200
        y2021_2023: 200
        y2024_2025: 200
        y2026_partial: 100
      nominal_total_families: 700
      denominator: eligible_outcome_determinable_A_application_families_with_design_weights
  nonexclusive_components:
    E: drug_entity_or_exposure_signal_distinguishing_predicted_from_measured
    O: disease_context_signal
    C: binding_engagement_or_functional_mediation_signal
  case_enrichment_rule: exclude_from_all_A_prevalence_period_and_route_denominators
  route_derivation: extract_components_first_then_derive_route
  strict_middle_out_rule: claim_context_appropriate_drug_anchor_plus_disease_module_plus_E3b_functional_mediation
  full_target_causal_claim_rule: E3a_binding_or_engagement_plus_E3b_effect_modification_or_rescue_plus_concentration_or_exposure_congruence

pilot_search_snapshot:
  source: PubMed_NCBI_EUtilities
  executed_on: 2026-08-10
  status: feasibility_pilot_not_formal_frozen_search
  counts:
    A: 17528
    M: 183
    M2_high_sensitivity_adjacent: 15
    E: 911
    O: 2329
    C: 2455
    H_E_intersect_C: 108
  interpretation:
    - all_counts_overlap_and_must_not_be_summed
    - query_hit_is_not_included_evidence
    - M2_has_high_semantic_noise_and_only_one_clear_method_title_in_initial_audit
    - E_contains_predicted_ADME_PK_noise
    - C_contains_noncausal_rescue_and_dose_response_noise
  freeze_prerequisites:
    - PRESS_information_specialist_review
    - sentinel_recall_check
    - NCBI_query_translation_review
    - actual_last_search_date_and_live_counts
    - complete_export_fields_raw_responses_and_hashes

charting_and_appraisal:
  axes:
    - reporting_completeness_without_total_score
    - E0_E5_evidence_components_not_a_validated_scale
    - domain_based_research_credibility_without_total_score
  E3_split:
    E3a: direct_binding_or_cellular_target_engagement
    E3b: target_specific_functional_mediation
  E4_rule: matched_species_dose_time_compartment_exposure_and_in_vivo_mechanistic_alignment
  missing_values: [reported_yes, reported_no, not_reported, unclear, not_applicable]
  not_reported_is_not_not_performed: true
  pilot_requirement: at_least_10_maximally_heterogeneous_sources_by_two_human_reviewers
  schema_version_policy: G2_approval_freezes_pilot_baseline_only_post_pilot_changes_require_v2_and_amendment

screening_and_analysis:
  human_calibration:
    titles_abstracts_minimum: 50
    full_texts_minimum: 20
    statistics: [raw_agreement, Gwets_AC1, Cohens_kappa]
    adjudication: consensus_then_third_human_reviewer
  estimator:
    target: period_specific_binary_feature_proportion_among_eligible_A_application_families
    point: Hajek_domain_proportion
    variance: Taylor_linearization_with_stratification_and_finite_population_correction
    confidence_interval: design_based_logit_95pct_t_interval_beta_fallback_for_boundary_events
    period_difference: Taylor_linearized_absolute_contrast_with_95pct_t_interval
  missing_outcome_policy:
    primary: outcome_determinable_families_only_never_code_missing_as_negative
    mandatory_outputs: weighted_missing_rate_and_all_missing_no_to_all_missing_yes_bounds
    sensitivity_trigger: response_propensity_weighting_if_over_5pct_in_any_period
  y2026_policy: descriptive_partial_snapshot_excluded_from_complete_period_comparison

prohibited_inferences:
  - cross_database_or_cross_language_exhaustiveness
  - global_network_pharmacology_route_prevalence
  - route_prevalence_before_full_text_double_coding_and_new_human_decision
  - direct_2026_to_complete_year_trend_comparison
  - global_paradigm_shift_or_causal_time_trend
  - guideline_presence_as_evidence_of_field_adoption
  - database_association_hub_enrichment_docking_or_MD_as_target_engagement
  - any_single_E3_component_as_complete_X_Y_Z_target_causality
  - unaligned_cross_species_exposure_as_E4
  - E0_E5_as_validated_quality_or_certainty_scale
  - clinical_effectiveness_safety_or_treatment_recommendation
  - not_reported_as_not_performed

risk_register:
  - risk_id: NP-G2-RISK-001
    level: high
    risk: PubMed_only_coverage_and_language_bias
    mitigation: persistent_scope_label_and_reopen_G1_for_multidatabase_upgrade
  - risk_id: NP-G2-RISK-002
    level: high
    risk: high_evidence_signal_spectrum_bias
    mitigation: A_channel_probability_sample_is_the_only_practice_denominator
  - risk_id: NP-G2-RISK-003
    level: high
    risk: validation_term_semantic_contamination
    mitigation: action_level_E3a_E3b_charting_and_locator_verification
  - risk_id: NP-G2-RISK-004
    level: medium
    risk: limited_precision_after_ineligibility_or_missing_full_text
    mitigation: actual_domain_sample_design_based_CI_missingness_bounds_and_sensitivity_analysis
  - risk_id: NP-G2-RISK-005
    level: high
    risk: AI_extraction_or_classification_error
    mitigation: AI_prefill_only_with_human_locator_verification_and_independent_adjudication

independent_verification:
  methodologist:
    initial_verdict: revision_required
    final_verdict: pass
  evidence_auditor:
    initial_verdict: needs_revision_before_approval
    final_verdict: pass
  review_trace: NP-G2-REVIEW-001
  limitation: agent_verification_does_not_substitute_for_human_PI_PRESS_or_two_human_reviewers

